name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.9', '3.13', '3.14']
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff==0.16.10 build setuptools wheel
      - run: python -m pip install --no-deps adafruit-circuitpython-motor
      - run: python -m pip install -e .
      - run: ruff check . && ruff format --check .
      - run: python -m pytest
      - run: python -m build

name: Documentation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[docs]'
      - run: make -C docs html

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Adafruit-Blinka-Raspberry-Pi-PWM"
version = "0.0.1.dev0"
description = "Experimental CircuitPython-compatible Raspberry Pi software PWM backend"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Melissa LeBlanc-Williams"}]
dependencies = ["gpiod>=2.2.2,<3; sys_platform == 'linux'"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
]

[project.optional-dependencies]
test = ["pytest>=7", "adafruit-circuitpython-motor"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=2,<4", "myst-parser>=2,<5"]
dev = ["pre-commit>=4,<5", "ruff==0.16.10", "build>=1"]

[project.urls]
Homepage = "https://github.com/makermelissa/adafruit_blinka_raspberry_pi_pwm"
Source = "https://github.com/makermelissa/adafruit_blinka_raspberry_pi_pwm"
Issues = "https://github.com/makermelissa/adafruit_blinka_raspberry_pi_pwm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adafruit_blinka_raspberry_pi_pwm*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

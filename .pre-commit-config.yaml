# Run `pre-commit run --all-files` or install the hooks with `pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.patch$'
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.16.10]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: python
        additional_dependencies: [ruff==0.16.10]
        types_or: [python, pyi]
